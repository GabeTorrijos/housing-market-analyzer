<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>U.S. Housing Market Correlation Analyzer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --page: #0d0d0d;
            --surface: #161615;
            --surface-2: #1c1c1b;
            --border: rgba(255,255,255,0.09);
            --border-strong: rgba(255,255,255,0.16);
            --text-primary: #f2f2f0;
            --text-secondary: #c3c2b7;
            --text-muted: #82817a;
            --gridline: #2c2c2a;
            --accent: #3987e5;
            --success: #2fae63;
            --danger: #e0645a;
            --radius-card: 10px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif;
            background: var(--page);
            color: var(--text-secondary);
            line-height: 1.5;
            font-size: 14px;
        }
        header {
            background: var(--page);
            border-bottom: 1px solid var(--border);
            padding: 22px 32px;
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
        }
        header h1 { font-size: 1.05rem; font-weight: 700; color: var(--text-primary); letter-spacing: -0.01em; }
        header p { color: var(--text-muted); font-size: 0.8rem; }
        header a { color: var(--text-secondary); text-decoration: none; border-bottom: 1px solid var(--border-strong); }
        header a:hover { color: var(--text-primary); border-color: var(--text-secondary); }

        .container { max-width: 1200px; margin: 0 auto; padding: 40px 32px 64px; }
        .eyebrow {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            margin-bottom: 14px;
        }
        .card { background: var(--surface); border-radius: var(--radius-card); padding: 24px; margin-bottom: 20px; border: 1px solid var(--border); }
        .charts-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-bottom: 20px; }
        .chart-card { background: var(--surface); border-radius: var(--radius-card); padding: 22px; border: 1px solid var(--border); }
        .chart-title { font-size: 0.92rem; font-weight: 600; color: var(--text-primary); margin-bottom: 3px; }
        .chart-subtitle { font-size: 0.78rem; color: var(--text-muted); margin-bottom: 16px; }
        .chart-wrapper { position: relative; height: 220px; }
        .stat-row { display: flex; gap: 18px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
        .stat { font-size: 0.74rem; color: var(--text-muted); }
        .stat strong { display: block; font-size: 0.88rem; font-weight: 600; color: var(--text-primary); margin-top: 2px; }

        .heatmap-scale { display: flex; align-items: center; gap: 8px; margin-bottom: 20px; font-size: 0.72rem; color: var(--text-muted); }
        .heatmap-scale .bar { flex: 1; max-width: 260px; height: 8px; border-radius: 4px; background: linear-gradient(to right, #e0645a, #2c2c2a 50%, #3987e5); }
        .heatmap-row { display: flex; gap: 3px; align-items: center; margin-bottom: 3px; }
        .heatmap-label { width: 180px; font-size: 0.78rem; color: var(--text-secondary); text-align: right; padding-right: 12px; }
        .heatmap-cell { flex: 1; max-width: 140px; height: 52px; display: flex; align-items: center; justify-content: center; border-radius: 6px; font-size: 0.88rem; font-weight: 600; font-variant-numeric: tabular-nums; }
        .col-labels { display: flex; gap: 3px; margin-left: 192px; margin-bottom: 8px; }
        .col-label { flex: 1; max-width: 140px; font-size: 0.72rem; color: var(--text-muted); text-align: center; }

        .insights-list { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
        .insight-row { display: flex; align-items: baseline; gap: 10px; padding: 12px 16px; font-size: 0.85rem; border-bottom: 1px solid var(--border); }
        .insight-row:last-child { border-bottom: none; }
        .insight-arrow { font-size: 0.7rem; width: 12px; flex-shrink: 0; }
        .insight-arrow.up { color: var(--success); }
        .insight-arrow.down { color: var(--danger); }
        .insight-text { color: var(--text-secondary); }
        .insight-row.strong .insight-text { color: var(--text-primary); font-weight: 500; }
        .insight-row.weak .insight-text { color: var(--text-muted); }

        .loading { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 100px 20px; color: var(--text-muted); font-size: 0.9rem; }
        .spinner { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--border-strong); border-top-color: var(--accent); animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 768px) {
            .charts-grid { grid-template-columns: 1fr; }
            .heatmap-label { width: 100px; font-size: 0.68rem; }
            .col-labels { margin-left: 106px; }
        }
    </style>
</head>
<body>
    <header>
        <h1>U.S. Housing Market Correlation Analyzer</h1>
        <p>Powered by <a href="https://housing-data-pipeline.vercel.app" target="_blank">Housing Data Pipeline API</a> &middot; Data via FRED</p>
    </header>

    <div class="container">
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <div>Loading data from Housing Data Pipeline&hellip;</div>
        </div>
        <div id="content" style="display:none;">

            <div class="eyebrow">Trend Analysis</div>
            <div class="charts-grid" id="chartsGrid"></div>

            <div class="card">
                <div class="eyebrow">Correlation Matrix</div>
                <div class="heatmap-scale">
                    <span>&minus;1.0</span>
                    <div class="bar"></div>
                    <span>+1.0</span>
                </div>
                <div id="heatmap"></div>
            </div>

            <div class="card">
                <div class="eyebrow">Key Insights</div>
                <div class="insights-list" id="insights"></div>
            </div>

        </div>
    </div>

    <script>
        Chart.defaults.font.family = "'Inter', sans-serif";

        // Fixed categorical order (CVD-safe): blue, orange, aqua, yellow
        const COLORS = {
            "Median Home Price": "#3987e5",
            "30-Year Mortgage Rate": "#d95926",
            "Housing Starts": "#199e70",
            "Home Ownership Rate": "#c98500"
        };

        const FORMATS = {
            "Median Home Price": v => "$" + Math.round(v).toLocaleString(),
            "30-Year Mortgage Rate": v => v.toFixed(2) + "%",
            "Housing Starts": v => Math.round(v).toLocaleString() + "K",
            "Home Ownership Rate": v => v.toFixed(1) + "%"
        };

        const SUBTITLES = {
            "Median Home Price": "U.S. median sales price (USD)",
            "30-Year Mortgage Rate": "Average fixed mortgage rate (%)",
            "Housing Starts": "New privately-owned housing starts (thousands)",
            "Home Ownership Rate": "U.S. homeownership rate (%)"
        };

        fetch('/api/data')
            .then(r => r.json())
            .then(data => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';

                // Individual trend charts
                const grid = document.getElementById('chartsGrid');
                data.columns.forEach(col => {
                    const series = data.chart[col];
                    const sorted = series.labels
                        .map((d, i) => ({ date: d, value: series.values[i] }))
                        .sort((a, b) => a.date.localeCompare(b.date));

                    const values = sorted.map(p => p.value);
                    const latest = values[values.length - 1];
                    const earliest = values[0];
                    const change = ((latest - earliest) / earliest * 100).toFixed(1);
                    const fmt = FORMATS[col] || (v => v.toFixed(2));
                    const color = COLORS[col] || "#3987e5";

                    const card = document.createElement('div');
                    card.className = 'chart-card';
                    card.innerHTML = `
                        <div class="chart-title">${col}</div>
                        <div class="chart-subtitle">${SUBTITLES[col] || ''}</div>
                        <div class="chart-wrapper"><canvas></canvas></div>
                        <div class="stat-row">
                            <div class="stat">Latest<strong>${fmt(latest)}</strong></div>
                            <div class="stat">${sorted[0].date.slice(0, 4)}<strong>${fmt(earliest)}</strong></div>
                            <div class="stat">Change<strong style="color:${change >= 0 ? 'var(--success)' : 'var(--danger)'}">${change >= 0 ? '+' : ''}${change}%</strong></div>
                        </div>
                    `;
                    grid.appendChild(card);

                    new Chart(card.querySelector('canvas'), {
                        type: 'line',
                        data: {
                            labels: sorted.map(p => p.date),
                            datasets: [{
                                label: col,
                                data: values,
                                borderColor: color,
                                backgroundColor: color + '1a',
                                borderWidth: 2,
                                pointRadius: ctx => ctx.dataIndex === values.length - 1 ? 3 : 0,
                                pointBackgroundColor: color,
                                pointBorderColor: '#161615',
                                pointBorderWidth: 2,
                                tension: 0.25,
                                fill: true
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            interaction: { mode: 'index', intersect: false },
                            plugins: {
                                legend: { display: false },
                                tooltip: {
                                    backgroundColor: '#1c1c1b',
                                    borderColor: '#2c2c2a',
                                    borderWidth: 1,
                                    titleColor: '#f2f2f0',
                                    bodyColor: '#c3c2b7',
                                    padding: 10,
                                    displayColors: false,
                                    callbacks: {
                                        label: ctx => fmt(ctx.parsed.y)
                                    }
                                }
                            },
                            scales: {
                                x: {
                                    ticks: { color: '#82817a', maxTicksLimit: 6, font: { size: 10 } },
                                    grid: { color: '#2c2c2a' }
                                },
                                y: {
                                    ticks: {
                                        color: '#82817a',
                                        font: { size: 10 },
                                        callback: v => fmt(v)
                                    },
                                    grid: { color: '#2c2c2a' }
                                }
                            }
                        }
                    });
                });

                // Correlation heatmap (diverging: red = negative, blue = positive)
                const cols = data.columns;
                const corr = data.correlation;
                const heatmap = document.getElementById('heatmap');
                const colLabels = document.createElement('div');
                colLabels.className = 'col-labels';
                cols.forEach(c => {
                    const l = document.createElement('div');
                    l.className = 'col-label';
                    l.textContent = c;
                    colLabels.appendChild(l);
                });
                heatmap.appendChild(colLabels);
                cols.forEach(row => {
                    const rowDiv = document.createElement('div');
                    rowDiv.className = 'heatmap-row';
                    const lbl = document.createElement('div');
                    lbl.className = 'heatmap-label';
                    lbl.textContent = row;
                    rowDiv.appendChild(lbl);
                    cols.forEach(col => {
                        const val = corr[row] ? corr[row][col] : 0;
                        const cell = document.createElement('div');
                        cell.className = 'heatmap-cell';
                        cell.textContent = val !== undefined ? val.toFixed(2) : '-';
                        const intensity = Math.abs(val || 0);
                        const pole = val > 0 ? '57,135,229' : '224,100,90';
                        cell.style.background = `rgba(${pole},${(intensity * 0.75).toFixed(2)})`;
                        cell.style.color = intensity > 0.45 ? '#f2f2f0' : '#82817a';
                        rowDiv.appendChild(cell);
                    });
                    heatmap.appendChild(rowDiv);
                });

                // Insights
                const insightsDiv = document.getElementById('insights');
                data.insights.forEach(insight => {
                    const row = document.createElement('div');
                    row.className = 'insight-row';
                    if (insight.includes('strong')) row.classList.add('strong');
                    else if (insight.includes('weak')) row.classList.add('weak');
                    const isPositive = insight.includes('positive');
                    row.innerHTML = `<span class="insight-arrow ${isPositive ? 'up' : 'down'}">${isPositive ? '&#9650;' : '&#9660;'}</span><span class="insight-text">${insight}</span>`;
                    insightsDiv.appendChild(row);
                });
            })
            .catch(err => {
                document.getElementById('loading').innerHTML = '<div>Error loading data. Make sure the Housing Data Pipeline is running.</div>';
                console.error(err);
            });
    </script>
</body>
</html>
