<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>U.S. Housing Market Correlation Analyzer</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, 'Segoe UI', sans-serif; background: #0f1117; color: #e0e0e0; line-height: 1.5; }
        header { background: linear-gradient(135deg, #1a1d2e 0%, #1e2438 100%); padding: 32px 40px; border-bottom: 2px solid #2a2d3e; }
        header h1 { font-size: 1.9rem; color: #60a5fa; font-weight: 700; letter-spacing: -0.02em; }
        header p { color: #9ca3af; margin-top: 6px; font-size: 0.95rem; }
        header a { color: #60a5fa; text-decoration: none; }
        header a:hover { text-decoration: underline; }
        .container { max-width: 1280px; margin: 0 auto; padding: 32px 24px; }
        .section-title { font-size: 1.15rem; font-weight: 600; color: #60a5fa; margin-bottom: 18px; display: flex; align-items: center; gap: 8px; }
        .card { background: #1a1d2e; border-radius: 14px; padding: 28px; margin-bottom: 24px; border: 1px solid #2a2d3e; }
        .charts-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-bottom: 24px; }
        .chart-card { background: #1a1d2e; border-radius: 14px; padding: 24px; border: 1px solid #2a2d3e; }
        .chart-title { font-size: 1rem; font-weight: 600; color: #e0e0e0; margin-bottom: 6px; }
        .chart-subtitle { font-size: 0.8rem; color: #9ca3af; margin-bottom: 18px; }
        .chart-wrapper { position: relative; height: 240px; }
        .insights-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
        .insight-item { background: #0f1117; border-left: 4px solid #60a5fa; padding: 14px 18px; border-radius: 8px; font-size: 0.9rem; line-height: 1.6; }
        .insight-item.strong { border-left-color: #34d399; }
        .insight-item.weak { border-left-color: #6b7280; }
        .insight-item.negative { border-left-color: #f87171; }
        .heatmap-row { display: flex; gap: 4px; align-items: center; margin-bottom: 4px; }
        .heatmap-label { width: 180px; font-size: 0.8rem; color: #9ca3af; text-align: right; padding-right: 12px; font-weight: 500; }
        .heatmap-cell { flex: 1; max-width: 140px; height: 56px; display: flex; align-items: center; justify-content: center; border-radius: 8px; font-size: 0.95rem; font-weight: 700; }
        .col-labels { display: flex; gap: 4px; margin-left: 184px; margin-bottom: 8px; }
        .col-label { flex: 1; max-width: 140px; font-size: 0.78rem; color: #9ca3af; text-align: center; font-weight: 500; }
        .loading { text-align: center; padding: 80px 20px; color: #9ca3af; font-size: 1.05rem; }
        .stat-row { display: flex; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
        .stat { background: #0f1117; padding: 8px 14px; border-radius: 6px; font-size: 0.8rem; color: #9ca3af; }
        .stat strong { color: #e0e0e0; margin-left: 4px; }
        @media (max-width: 768px) {
            .charts-grid { grid-template-columns: 1fr; }
            .heatmap-label { width: 110px; font-size: 0.7rem; }
            .col-labels { margin-left: 114px; }
        }
    </style>
</head>
<body>
    <header>
        <h1>🏠 U.S. Housing Market Correlation Analyzer</h1>
        <p>Powered by <a href="https://housing-data-pipeline.onrender.com" target="_blank">Housing Data Pipeline API</a> · Data sourced from FRED (Federal Reserve)</p>
    </header>

    <div class="container">
        <div id="loading" class="loading">⏳ Loading data from Housing Data Pipeline...</div>
        <div id="content" style="display:none;">

            <div class="section-title">📈 Individual Trend Charts</div>
            <div class="charts-grid" id="chartsGrid"></div>

            <div class="card">
                <div class="section-title">🔥 Correlation Heatmap</div>
                <div id="heatmap"></div>
            </div>

            <div class="card">
                <div class="section-title">💡 Key Insights</div>
                <div class="insights-grid" id="insights"></div>
            </div>

        </div>
    </div>

    <script>
        const COLORS = {
            "Median Home Price": "#f87171",
            "30-Year Mortgage Rate": "#60a5fa",
            "Housing Starts": "#34d399",
            "Home Ownership Rate": "#f59e0b"
        };

        const FORMATS = {
            "Median Home Price": v => "$" + Math.round(v).toLocaleString(),
            "30-Year Mortgage Rate": v => v.toFixed(2) + "%",
            "Housing Starts": v => Math.round(v).toLocaleString() + "K",
            "Home Ownership Rate": v => v.toFixed(1) + "%"
        };

        const SUBTITLES = {
            "Median Home Price": "U.S. median sales price (USD)",
            "30-Year Mortgage Rate": "Average fixed mortgage rate (%)",
            "Housing Starts": "New privately-owned housing starts (thousands)",
            "Home Ownership Rate": "U.S. homeownership rate (%)"
        };

        fetch('/api/data')
            .then(r => r.json())
            .then(data => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';

                // Individual charts
                const grid = document.getElementById('chartsGrid');
                data.columns.forEach(col => {
                    const series = data.chart[col];
                    const sorted = series.labels
                        .map((d, i) => ({ date: d, value: series.values[i] }))
                        .sort((a, b) => a.date.localeCompare(b.date));

                    const values = sorted.map(p => p.value);
                    const latest = values[values.length - 1];
                    const earliest = values[0];
                    const change = ((latest - earliest) / earliest * 100).toFixed(1);
                    const fmt = FORMATS[col] || (v => v.toFixed(2));

                    const card = document.createElement('div');
                    card.className = 'chart-card';
                    card.innerHTML = `
                        <div class="chart-title">${col}</div>
                        <div class="chart-subtitle">${SUBTITLES[col] || ''}</div>
                        <div class="chart-wrapper"><canvas></canvas></div>
                        <div class="stat-row">
                            <div class="stat">Latest: <strong>${fmt(latest)}</strong></div>
                            <div class="stat">2000: <strong>${fmt(earliest)}</strong></div>
                            <div class="stat">Change: <strong style="color:${change >= 0 ? '#34d399' : '#f87171'}">${change >= 0 ? '+' : ''}${change}%</strong></div>
                        </div>
                    `;
                    grid.appendChild(card);

                    new Chart(card.querySelector('canvas'), {
                        type: 'line',
                        data: {
                            labels: sorted.map(p => p.date),
                            datasets: [{
                                label: col,
                                data: values,
                                borderColor: COLORS[col],
                                backgroundColor: COLORS[col] + '22',
                                borderWidth: 2,
                                pointRadius: 0,
                                tension: 0.3,
                                fill: true
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            interaction: { mode: 'index', intersect: false },
                            plugins: {
                                legend: { display: false },
                                tooltip: {
                                    callbacks: {
                                        label: ctx => fmt(ctx.parsed.y)
                                    }
                                }
                            },
                            scales: {
                                x: {
                                    ticks: { color: '#9ca3af', maxTicksLimit: 6, font: { size: 10 } },
                                    grid: { color: '#2a2d3e' }
                                },
                                y: {
                                    ticks: {
                                        color: '#9ca3af',
                                        font: { size: 10 },
                                        callback: v => fmt(v)
                                    },
                                    grid: { color: '#2a2d3e' }
                                }
                            }
                        }
                    });
                });

                // Heatmap
                const cols = data.columns;
                const corr = data.correlation;
                const heatmap = document.getElementById('heatmap');
                const colLabels = document.createElement('div');
                colLabels.className = 'col-labels';
                cols.forEach(c => {
                    const l = document.createElement('div');
                    l.className = 'col-label';
                    l.textContent = c;
                    colLabels.appendChild(l);
                });
                heatmap.appendChild(colLabels);
                cols.forEach(row => {
                    const rowDiv = document.createElement('div');
                    rowDiv.className = 'heatmap-row';
                    const lbl = document.createElement('div');
                    lbl.className = 'heatmap-label';
                    lbl.textContent = row;
                    rowDiv.appendChild(lbl);
                    cols.forEach(col => {
                        const val = corr[row] ? corr[row][col] : 0;
                        const cell = document.createElement('div');
                        cell.className = 'heatmap-cell';
                        cell.textContent = val !== undefined ? val.toFixed(2) : '-';
                        const intensity = Math.abs(val || 0);
                        if (val > 0) cell.style.background = `rgba(96,165,250,${intensity * 0.85})`;
                        else cell.style.background = `rgba(248,113,113,${intensity * 0.85})`;
                        cell.style.color = intensity > 0.4 ? '#fff' : '#9ca3af';
                        rowDiv.appendChild(cell);
                    });
                    heatmap.appendChild(rowDiv);
                });

                // Insights
                const insightsDiv = document.getElementById('insights');
                data.insights.forEach(insight => {
                    const div = document.createElement('div');
                    div.className = 'insight-item';
                    if (insight.includes('strong')) div.classList.add('strong');
                    else if (insight.includes('weak')) div.classList.add('weak');
                    if (insight.includes('negative')) div.classList.add('negative');
                    div.textContent = insight;
                    insightsDiv.appendChild(div);
                });
            })
            .catch(err => {
                document.getElementById('loading').textContent = '❌ Error loading data. Make sure the Housing Data Pipeline is running.';
                console.error(err);
            });
    </script>
</body>
</html>
